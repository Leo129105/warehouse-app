<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的倉庫整理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1976d2;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 10px;
      border-radius: 9px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      border: none;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button.delete {
      background: #d32f2f;
    }

    button.edit {
      background: #555;
    }

    .item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .item-name {
      font-size: 19px;
      font-weight: bold;
    }

    .location {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 10px;
      background: #e3f2fd;
      color: #1565c0;
      border-radius: 20px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .buttons button {
      margin: 0;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBctBq3ADv4nVDEVY_vFJW-Ep1KG9XsWWE",
    authDomain: "warehous-app-c9d8c.firebaseapp.com",
    projectId: "warehous-app-c9d8c",
    storageBucket: "warehous-app-c9d8c.firebasestorage.app",
    messagingSenderId: "570923244693",
    appId: "1:570923244693:web:1b815db517650afc5d4f9c"
  };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
</script>
</head>

<body>

<header>
  <h1>📦 我的倉庫整理</h1>
</header>

<div class="container">

  <div class="card">
    <h2>新增貨品</h2>

    <input
      type="text"
      id="itemName"
      placeholder="輸入貨品名稱"
    >

    <select id="itemLocation">
      <option value="01">01</option>
      <option value="02">02</option>
      <option value="03">03</option>
      <option value="05">05</option>
    </select>

    <button onclick="addItem()">＋ 新增貨品</button>
  </div>

  <div class="card">
    <h2>🔎 搜尋貨品</h2>

    <input
      type="text"
      id="search"
      placeholder="輸入貨品名稱或地點"
      oninput="showItems()"
    >
  </div>

  <div class="card">
    <h2>📋 貨品清單</h2>

    <div id="itemList"></div>
  </div>

</div>

<script>

  let items = JSON.parse(localStorage.getItem("warehouseItems")) || [];

async function saveItems() {
  localStorage.setItem("warehouseItems", JSON.stringify(items));
  await setDoc(doc(db, "warehouseItems", "items"), { items });
}

  function addItem() {

    const nameInput = document.getElementById("itemName");
    const locationInput = document.getElementById("itemLocation");

    const name = nameInput.value.trim();
    const location = locationInput.value;

    if (name === "") {
      alert("請輸入貨品名稱");
      return;
    }

    const item = {
      id: Date.now(),
      name: name,
      location: location
    };

    items.push(item);

    saveItems();

    nameInput.value = "";

    showItems();
  }
window.addItem = addItem;
  function showItems() {

    const list = document.getElementById("itemList");
    const search = document.getElementById("search").value
      .trim()
      .toLowerCase();

    list.innerHTML = "";

    const filteredItems = items.filter(item => {

      return (
        item.name.toLowerCase().includes(search) ||
        item.location.toLowerCase().includes(search)
      );

    });

    if (filteredItems.length === 0) {
      list.innerHTML =
        '<div class="empty">目前沒有找到貨品</div>';
      return;
    }

    filteredItems.forEach(item => {

      const div = document.createElement("div");

      div.className = "item";

      div.innerHTML = `
        <div class="item-name">
          ${escapeHtml(item.name)}
        </div>

        <div class="location">
          放置地點：${escapeHtml(item.location)}
        </div>

        <div class="buttons">
          <button class="edit"
            onclick="editItem(${item.id})">
            修改
          </button>

          <button class="delete"
            onclick="deleteItem(${item.id})">
            刪除
          </button>
        </div>
      `;

      list.appendChild(div);
    });
  }

  function editItem(id) {

    const item = items.find(item => item.id === id);

    if (!item) return;

    const newName = prompt(
      "修改貨品名稱：",
      item.name
    );

    if (newName === null) return;

    const cleanName = newName.trim();

    if (cleanName === "") {
      alert("貨品名稱不能為空白");
      return;
    }

    const newLocation = prompt(
      "修改放置地點（01、02、03、05）：",
      item.location
    );

    if (newLocation === null) return;

    const location = newLocation.trim();

    if (!["01", "02", "03", "05"].includes(location)) {
      alert("放置地點只能輸入 01、02、03 或 05");
      return;
    }

    item.name = cleanName;
    item.location = location;

    saveItems();
    showItems();
  }

  function deleteItem(id) {

    const item = items.find(item => item.id === id);

    if (!item) return;

  const ok = confirm(
  `確定要刪除「${item.name}」嗎？`
);

    if (!ok) return;

    items = items.filter(item => item.id !== id);

    saveItems();
    showItems();
  }

  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

  showItems();

</script>

</body>
</html>
